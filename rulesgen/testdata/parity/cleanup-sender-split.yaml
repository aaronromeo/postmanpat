rules:
  - name: "Notify (a@example.com)"
    server:
      folders:
        - "INBOX"
      sender_substring:
        - "notify.example.net"
      list_unsubscribe: false
      recipients:
        - "a@example.com"
    actions:
      - type: "delete"
